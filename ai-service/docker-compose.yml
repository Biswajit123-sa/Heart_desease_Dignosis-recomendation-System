version: "3.9"

services:
  api:
    build: .
    container_name: heart-disease-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./ml_models:/app/ml_models
      - ./logs:/app/logs
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: heart-disease-ai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
